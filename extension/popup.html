<!DOCTYPE html>
<html>
<head>
  <title>Scholic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
  <style>
    body {
      width: 280px;
      padding: 20px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0d0d0d;
      color: #e0e0e0;
      margin: 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .brand-text {
      font-family: 'Outfit', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
    }
    .brand-text .hash {
      color: #6EB781;
    }
    .subtitle {
      font-size: 12px;
      color: #666;
      margin-bottom: 16px;
    }
    .btn {
      width: 100%;
      padding: 9px;
      background: #6EB781;
      border: none;
      color: #fff;
      font-weight: 600;
      font-size: 13px;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.15s;
    }
    .btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="brand">
    <svg width="28" height="28" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="28" cy="10" r="5" fill="#E8C547"/>
      <circle cx="42" cy="18" r="5" fill="#E87347"/>
      <circle cx="44" cy="34" r="5" fill="#6EB781"/>
      <circle cx="34" cy="46" r="5" fill="#47A3E8"/>
      <circle cx="18" cy="44" r="5" fill="#9B6EB7"/>
      <circle cx="12" cy="28" r="5" fill="#E8477A"/>
      <circle cx="18" cy="16" r="5" fill="#47E8C5"/>
      <circle cx="30" cy="28" r="3.5" fill="#6EB781"/>
    </svg>
    <span class="brand-text"><span class="hash">#</span>scholic</span>
  </div>
  <p class="subtitle">Annotate the web, together.</p>
  <button class="btn" id="openFeed">Open Feed</button>

  <script>
    document.getElementById('openFeed').addEventListener('click', () => {
      chrome.tabs.create({ url: 'http://localhost:5173/feed' });
    });
  </script>
</body>
</html>
