name: Extension CI

on:
  push:
    branches:
      - '**'
    paths:
      - 'extension/**'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'extension/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: extension/package-lock.json
      - name: Install dependencies
        run: cd extension && npm install
      - name: Build extension
        run: cd extension && npm run build
        env:
          API_BASE: ${{ secrets.EXT_API_BASE }}
          WEB_URL: ${{ secrets.EXT_WEB_URL }}
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: extension/dist/
          # Keep artifacts for 7 days — deploy workflow downloads from here
          retention-days: 7
