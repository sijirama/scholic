name: Backend CI

on:
  push:
    paths:
      - 'scholic/**'
  pull_request:
    paths:
      - 'scholic/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: scholic/go.sum
      - name: Build
        run: cd scholic && go build -v ./...
      - name: Test
        run: cd scholic && go test -v ./...
